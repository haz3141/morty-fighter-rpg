<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Morty Fighter RPG</title>
    <link rel="stylesheet" href="assets/css/style.css" />
</head>

<body>
    <div id="game">
        <!-- App Header -->
        <header id="appHeader">
            <h1>Morty Fighter RPG</h1>
            <div id="mountPhase"></div>
        </header>

        <!-- Main 3-Panel Arena -->
        <main id="appMain" class="hidden">
            <!-- Left Panel: Player -->
            <section id="panelPlayer">
                <h2>Your Morty!</h2>
                <div id="mountPlayer"></div>
            </section>

            <!-- Center Panel: Arena (actions + log) -->
            <section id="panelArena">
                <div id="mountActions"></div>
                <div id="mountLog"></div>
            </section>

            <!-- Right Panel: Enemies -->
            <section id="panelEnemies">
                <h2>Opponents</h2>
                <div id="mountEnemies"></div>
            </section>
        </main>

        <!-- Roster for pick-player phase -->
        <div id="roster">
            <h2>Select your Morty!</h2>
        </div>

        <!-- Legacy elements (kept for compatibility during transition) -->
        <div id="attacker" class="hidden">
            <h2>Your Morty!</h2>
        </div>

        <div id="enemies" class="hidden">
            <h2>Your Opponents!</h2>
        </div>

        <div id="defender" class="hidden">
            <h2>Finish Him!!</h2>
        </div>

        <div id="fight-button">
            <button>FIGHT!!!</button>
        </div>

        <div id="messages"></div>
    </div>

    <!-- Scripts -->
    <script type="module" src="assets/javascript/main.js"></script>
</body>

</html>
