<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <title>Morty Fighter RPG</title>
        <link rel="stylesheet" href="assets/css/style.css" />
    </head>

    <body>
        <header id="appHeader">
            <h1>Morty Fighter RPG</h1>
            <div id="mountPhase"></div>
        </header>

        <main id="appMain">
            <section id="panelPlayer">
                <h2>Select your Morty!</h2>
                <div id="mountPlayer"></div>
            </section>

            <section id="panelArena">
                <h2>Arena</h2>
                <div id="mountActions">
                    <button type="button">FIGHT!!!</button>
                </div>
                <div id="mountLog"></div>
            </section>

            <section id="panelEnemies">
                <h2>Your Opponents!</h2>
                <div id="mountEnemies"></div>
            </section>
        </main>

        <!-- Scripts -->
        <script type="module" src="assets/javascript/main.js"></script>
    </body>
</html>
