<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <title>Morty Fighter RPG</title>
        <link rel="stylesheet" href="assets/css/style.css" />
    </head>

    <body>
        <div id="game">
            <div id="roster">
                <h2>Select your Morty!</h2>
            </div>

            <div id="attacker" class="hidden">
                <h2>Your Morty!</h2>
            </div>

            <div id="enemies" class="hidden">
                <h2>Your Opponents!</h2>
            </div>

            <div id="defender" class="hidden">
                <h2>Finish Him!!</h2>
            </div>

            <div id="fight-button">
                <button>FIGHT!!!</button>
            </div>

            <div id="messages"></div>
        </div>

        <!-- Scripts -->
        <script type="module" src="assets/javascript/main.js"></script>
    </body>
</html>
